<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Team Forensic Framework">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="30%" stop-color="#c8ced6"/>
      <stop offset="52%" stop-color="#8b939e"/>
      <stop offset="72%" stop-color="#e8ecf0"/>
      <stop offset="100%" stop-color="#9aa3ad"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#7c5cff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="#050506"/>
  <circle cx="128" cy="110" r="98" fill="url(#glow)"/>
  <!-- reticle / scope -->
  <g fill="none" stroke="#d7dde6" stroke-opacity="0.5" stroke-width="1.15">
    <circle cx="128" cy="110" r="82"/>
    <circle cx="128" cy="110" r="64"/>
    <circle cx="128" cy="110" r="46"/>
    <line x1="128" y1="18" x2="128" y2="202"/>
    <line x1="30" y1="110" x2="226" y2="110"/>
  </g>
  <g fill="#d7dde6" opacity="0.7">
    <circle cx="128" cy="28" r="2"/><circle cx="128" cy="192" r="2"/>
    <circle cx="40" cy="110" r="2"/><circle cx="216" cy="110" r="2"/>
  </g>
  <!-- glitch accents -->
  <g stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1">
    <line x1="36" y1="94" x2="72" y2="94"/>
    <line x1="184" y1="126" x2="220" y2="126"/>
  </g>
  <!-- TFF monogram (sharp metallic, NullX-style) -->
  <g fill="url(#metal)" stroke="#12141a" stroke-width="1.4" stroke-linejoin="round">
    <!-- T -->
    <polygon points="28,48 92,48 92,62 70,62 70,168 50,168 50,62 28,62"/>
    <!-- F -->
    <polygon points="98,48 158,48 158,62 118,62 118,96 150,96 150,110 118,110 118,168 98,168"/>
    <!-- F -->
    <polygon points="168,48 228,48 228,62 188,62 188,96 220,96 220,110 188,110 188,168 168,168"/>
  </g>
  <text x="128" y="218" text-anchor="middle" fill="#e8eef7"
