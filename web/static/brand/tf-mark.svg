        font-size="11" letter-spacing="5" font-weight="600">TEAM</text>
  <text x="128" y="238" text-anchor="middle" fill="#cfd5de"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="13" letter-spacing="2.5" font-weight="700">FORENSIC FRAMEWORK</text>
